<title>Life System</title>

<style>
/* Ember UI: a dark window (shell) holding light paper panels; one ember accent means "now". Single committed look. */
:root{
  color-scheme: light;
  --shell:#0f0f10; --raised:#1e1e20; --active:#262628; --sline:#2a2a2c; --chart:#141415;
  --sink:#f5f5f4; --sink2:#9a9a9e; --sink3:#6a6a6e;
  --paper:#fbfaf7; --tile:#f3f2ee; --line:#e9e7e1; --ink:#111111; --ink2:#77746e; --ink3:#a8a59e; --ring:#c9c6be; --white:#ffffff;
  --em:#ff5a1f; --emt:#fff1eb; --ems:#ffe9e0; --emi:#d5430f; --emtr:#ffd9ca;
  --gr:#23a35a; --grs:#e3f5e9; --gri:#23804a; --bl:#2b62d9; --bls:#e4edfd; --vi:#6c43d0; --vis:#eee7fd; --am:#e0a400; --ams:#fbf0d5; --ami:#9a6a00; --pk:#c65bd6; --pks:#f7e6fa; --pki:#9b3aab; --neu:#edebe5; --dot0:#dad8d1; --bar0:#d5d3cc;
  --font: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
}
*{box-sizing:border-box}
html,body{background:var(--shell)}
body{font-family:var(--font);font-weight:500;color:var(--sink);-webkit-font-smoothing:antialiased;font-size:13px;line-height:1.25}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;transition:background-color .15s,color .15s,border-color .15s}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--em);outline-offset:2px}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

.app{min-height:100vh;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:0 12px}
.top{min-height:58px;display:flex;flex-wrap:wrap;align-items:center;gap:12px;padding-block:12px}
.top .l{flex:1 1 200px;display:flex;align-items:center;gap:8px}
.top .r{flex:1 1 200px;display:flex;align-items:center;justify-content:flex-end;gap:8px}
.logo{width:26px;height:26px;border-radius:8px;background:var(--em);display:flex;align-items:center;justify-content:center;flex:none}
.brand{font-size:14px;font-weight:600}
.launch{flex:0 1 480px;min-width:220px;height:34px;border:0;border-radius:10px;background:var(--raised);color:var(--sink2);display:flex;align-items:center;gap:8px;padding:0 8px 0 12px;text-align:left}
.launch span{flex:1;font-weight:400}
.kbd{font-family:inherit;font-size:11px;font-weight:500;color:var(--ink2);background:var(--neu);border-radius:5px;padding:2px 6px}
.kbd.dk{color:var(--sink2);background:var(--active)}
.pill{height:34px;border-radius:10px;background:var(--raised);display:flex;align-items:center;gap:8px;padding:0 4px 0 12px;color:var(--sink)}
.pill .t{font-weight:600;color:var(--em);font-variant-numeric:tabular-nums}
.pill .n{max-width:180px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.livedot{width:7px;height:7px;border-radius:50%;background:var(--em);flex:none}
.ibd{width:28px;height:28px;border:0;border-radius:8px;background:transparent;color:var(--sink2);display:inline-flex;align-items:center;justify-content:center;padding:0;flex:none}
.ibd:hover{background:var(--active);color:var(--sink)}
.newb{height:34px;border:0;border-radius:10px;background:var(--sink);color:var(--ink);display:flex;align-items:center;gap:6px;padding:0 12px;font-weight:600}
.avatar{width:32px;height:32px;border:0;border-radius:50%;background:var(--active);color:var(--sink);font-weight:600}

.body{display:flex;flex-wrap:wrap;align-items:flex-start;gap:8px}
.sb{flex:0 0 220px;width:220px;padding:2px 8px 24px 0;display:flex;flex-direction:column}
.rem{background:var(--raised);border:1px solid var(--em);border-radius:14px;padding:12px 12px 14px 14px;display:flex;flex-direction:column;gap:10px}
.rem h2{margin:0;font-size:13px;font-weight:600}
.remi{display:flex;gap:10px;align-items:flex-start;background:none;border:0;padding:0;text-align:left;color:var(--sink)}
.remi .cb{width:16px;height:16px;flex:none;margin-top:1px;border-radius:4px;border:1.5px solid var(--sink3);background:var(--active)}
.remi small{display:block;font-size:11px;font-weight:400;color:var(--sink2);margin-top:2px}
.glab{font-size:11px;color:var(--sink3);padding-left:8px;margin:18px 0 6px;display:flex;justify-content:space-between;align-items:center}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{height:30px;border-radius:8px;color:var(--sink2);display:flex;align-items:center;gap:10px;padding:0 8px}
.nav a:hover{color:var(--sink);background:#18181a}
.nav a.on{background:var(--active);color:var(--sink)}
.nav a.on svg{color:var(--em)}
.nav a .c{margin-left:auto;font-size:11px;color:var(--sink3)}
.nav a.off{opacity:.45;cursor:default}
.nav a.off:hover{background:none;color:var(--sink2)}
.sdot{width:7px;height:7px;border-radius:50%;flex:none;margin:0 4px}
.chips{display:flex;flex-wrap:wrap;gap:6px;padding-left:8px}
.chips a{font-size:11px;color:var(--sink2);background:var(--raised);border-radius:6px;padding:4px 8px}

.panel{flex:999 1 560px;min-width:0;background:var(--paper);color:var(--ink);border-radius:18px;padding:26px 28px 28px;display:flex;flex-direction:column;gap:26px}
.rail{flex:1 1 300px;min-width:0;background:var(--paper);color:var(--ink);border-radius:18px;padding:22px 20px 24px;display:flex;flex-direction:column;gap:24px}
.rail.wide{flex-basis:380px}
.h1{margin:0;font-size:38px;line-height:46px;font-weight:700;letter-spacing:-.025em;text-wrap:balance}
.date{font-size:13px;font-weight:400;color:var(--ink3);margin-top:2px}
.hd{display:flex;flex-wrap:wrap;align-items:flex-start;justify-content:space-between;gap:12px}
.sh{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.h2{margin:0;display:flex;align-items:center;gap:8px;font-size:15px;line-height:18px;font-weight:600}
.h3{margin:0;font-size:13px;font-weight:600}
.meta{font-size:12px;line-height:15px;font-weight:400;color:var(--ink2)}
.cap{font-size:11px;line-height:13px;color:var(--ink3)}
.soft{color:var(--ink3)}
.emt{color:var(--emi)}
.stat{font-size:24px;line-height:29px;font-weight:700;letter-spacing:-.02em}
.num{font-variant-numeric:tabular-nums}
.flex{display:flex;align-items:center}
.wrap{flex-wrap:wrap}
.col{display:flex;flex-direction:column}
.grow{flex:1;min-width:0}
.between{justify-content:space-between}
.g4{gap:4px}.g6{gap:6px}.g8{gap:8px}.g10{gap:10px}.g12{gap:12px}.g14{gap:14px}.g16{gap:16px}.g24{gap:24px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
.grid.l{grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
.two{display:flex;flex-wrap:wrap;gap:24px;align-items:flex-start}
.two>*{flex:1 1 320px;min-width:0}
.tile{background:var(--tile);border-radius:12px;padding:12px 14px}
.tile.w{background:var(--white);box-shadow:inset 0 0 0 1px var(--line)}
.tile.sel{background:var(--white);box-shadow:inset 0 0 0 1.5px var(--ink)}
.tile.now{background:var(--emt)}
.tile.dash{background:transparent;box-shadow:inset 0 0 0 1.5px var(--line)}
button.tile{border:0;text-align:left;width:100%}
.dark{background:var(--chart);color:var(--sink);border-radius:18px;padding:22px 26px}
.dark .meta{color:var(--sink2)}
.tag{display:inline-block;font-size:11px;line-height:13px;font-weight:500;border-radius:6px;padding:3px 6px;background:var(--neu);color:var(--ink2);white-space:nowrap}
.chip{display:inline-block;font-size:12px;line-height:15px;font-weight:500;border-radius:7px;padding:4px 8px;background:var(--neu);color:var(--ink2);white-space:nowrap;border:0}
.t-em{background:var(--ems);color:var(--emi)}.t-gr{background:var(--grs);color:var(--gri)}.t-bl{background:var(--bls);color:var(--bl)}.t-vi{background:var(--vis);color:var(--vi)}.t-am{background:var(--ams);color:var(--ami)}.t-pk{background:var(--pks);color:var(--pki)}.t-ink{background:var(--ink);color:var(--white)}.t-dk{background:#3a1e12;color:#ff8a5c}
.ring{width:18px;height:18px;border:1.6px solid var(--ring);border-radius:50%;background:transparent;padding:0;flex:none;display:inline-flex;align-items:center;justify-content:center}
.ring:hover{border-color:var(--ink2)}
.ring.hi{border-color:var(--em)}.ring.md{border-color:var(--am)}
.ring.done{background:var(--ink);border-color:var(--ink)}
.ring.done::after{content:"";width:7px;height:4px;border-left:2px solid #fff;border-bottom:2px solid #fff;transform:translateY(-1px) rotate(-45deg)}
.ring.lg{width:22px;height:22px}
.btn{height:30px;border:0;border-radius:8px;background:var(--ink);color:var(--white);font-size:12px;font-weight:500;padding:0 12px;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap}
.btn.soft{background:var(--tile);color:var(--ink)}
.btn.wh{background:var(--white);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
.btn.em{background:var(--em);color:#fff}
.btn.inv{background:var(--sink);color:var(--ink)}
.btn.ghost{background:transparent;color:var(--ink2)}
.btn.l{height:40px;font-size:13px;padding:0 16px;border-radius:10px}
.btn.danger{background:var(--ems);color:var(--emi)}
.btn:disabled{opacity:.45;cursor:default}
.add{border:0;border-radius:7px;background:var(--tile);color:var(--ink2);font-size:12px;font-weight:500;padding:6px 10px 6px 8px;display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
.ib{width:28px;height:28px;border:0;border-radius:8px;background:transparent;color:var(--ink2);display:inline-flex;align-items:center;justify-content:center;padding:0;flex:none}
.ib:hover{background:var(--tile);color:var(--ink)}
.in{height:36px;border:0;border-radius:10px;background:var(--tile);padding:0 12px;font-size:13px;font-weight:400;color:var(--ink);width:100%;min-width:0}
.in.w{background:var(--white);box-shadow:inset 0 0 0 1px var(--line)}
textarea.in{height:auto;padding:10px 12px;line-height:19px;resize:vertical}
select.in{padding-right:8px}
.lbl{font-size:12px;color:var(--ink2);display:block;margin-bottom:6px}
.field{display:flex;flex-direction:column;min-width:0}
.seg{display:inline-flex;background:var(--tile);border-radius:8px;padding:2px;gap:2px;flex-wrap:wrap}
.seg button,.seg a{border:0;border-radius:6px;background:transparent;color:var(--ink2);font-size:12px;font-weight:500;padding:6px 11px;display:inline-flex;align-items:center;gap:6px}
.seg .on{background:var(--white);color:var(--ink)}
.seg.dk{background:var(--raised)}.seg.dk button{color:var(--sink2)}.seg.dk .on{background:var(--active);color:#fff}
.bar{height:5px;background:var(--line);border-radius:3px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--ink);border-radius:3px}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
.wk{display:flex;gap:6px}
.wk i{width:9px;height:9px;border-radius:50%;background:var(--dot0);display:block}
.wk i.d{background:var(--ink)}.wk i.s{background:var(--ring)}.wk i.t{background:transparent;box-shadow:inset 0 0 0 1.6px var(--em)}.wk i.f{background:transparent;box-shadow:inset 0 0 0 1.6px var(--ring)}
.itile{width:28px;height:28px;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;flex:none}
.trow{display:flex;gap:10px;align-items:flex-start}
.trow>.ring{margin-top:-1px}
.list{display:flex;flex-direction:column;gap:12px}
.sep{height:1px;background:var(--line)}
.empty{text-align:center;padding:24px 16px}
.click{cursor:pointer}
.row{background:var(--tile);border-radius:12px;padding:12px 14px;display:flex;gap:12px;align-items:flex-start}
.row:hover{background:#efeee9}
.row.sel{background:var(--white);box-shadow:inset 0 0 0 1.5px var(--ink)}
.row .tt{background:none;border:0;padding:0;text-align:left;flex:1;min-width:0;color:inherit}
.banner{background:var(--ams);color:#5e4300;border-radius:12px;padding:10px 14px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;font-size:12px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom, 0px));transform:translateX(-50%);background:var(--ink);color:#fff;border-radius:10px;padding:10px 16px;font-size:13px;z-index:50;max-width:calc(100% - 32px)}

/* compact task rows, toolbar, month grid, project colours */
.trc{display:flex;align-items:center;gap:10px;min-height:40px;padding:5px 12px;border-radius:10px;background:var(--tile)}
.trc:hover{background:#efeee9}
.trc.sel{background:var(--white);box-shadow:inset 0 0 0 1.5px var(--ink)}
.trc .tt{flex:1;min-width:0;display:flex;align-items:center;gap:8px;background:none;border:0;padding:0;text-align:left;color:inherit;min-height:30px}

.pri{font-size:11px;font-weight:600;flex:none}
.pri.h{color:var(--emi)}.pri.m{color:var(--ami)}
.pchip{display:inline-flex;align-items:center;gap:6px;font-size:11px;line-height:13px;font-weight:500;border-radius:6px;padding:3px 7px;white-space:nowrap;max-width:190px;overflow:hidden;text-overflow:ellipsis;flex:none}
.pchip i{width:6px;height:6px;border-radius:50%;flex:none}
.tbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.sel-s{height:30px;border:0;border-radius:8px;background:var(--tile);padding:0 8px;font-size:12px;font-weight:500;color:var(--ink);max-width:100%}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal .d{min-height:112px;background:var(--tile);border-radius:10px;padding:6px;display:flex;flex-direction:column;gap:3px;min-width:0}
.cal .d.o{background:transparent;box-shadow:inset 0 0 0 1px var(--line)}
.cal .cc{display:flex;align-items:center;gap:5px;font-size:11px;font-weight:500;background:var(--white);border:0;border-radius:5px;padding:3px 5px;text-align:left;min-width:0;width:100%;color:var(--ink)}
.cal .cc span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.sw{display:block;width:22px;height:22px;border-radius:50%;cursor:pointer}
input:checked + .sw{box-shadow:0 0 0 2px var(--paper),0 0 0 4px var(--ink)}
input:focus-visible + .sw{outline:2px solid var(--em);outline-offset:4px}
button.swb{border:0;padding:0;background:none;border-radius:50%}
button.swb.on .sw{box-shadow:0 0 0 2px var(--paper),0 0 0 4px var(--ink)}

/* timeline */
.tl{position:relative}
.tl .hl{position:absolute;left:40px;right:0;height:1px;background:var(--line)}
.tl .hlab{position:absolute;left:0;font-size:11px;font-weight:400;color:var(--ink3)}

.tl .blk.now{background:var(--emt)}
.tl .blk.mt{background:var(--bls)}
.tl .nowl{position:absolute;left:40px;right:0;height:2px;background:var(--em);opacity:.6;z-index:2}
.tl .nowb{position:absolute;left:0;font-size:10px;font-weight:600;color:#fff;background:var(--em);border-radius:5px;padding:2px 4px;z-index:3}

/* launcher */
.scrim{position:fixed;inset:0;background:rgba(15,15,16,.62);display:flex;justify-content:center;align-items:flex-start;padding:90px 16px 16px;z-index:40}
.lch{width:100%;max-width:660px;background:var(--paper);color:var(--ink);border-radius:18px;overflow:hidden}
.lch .q{display:flex;align-items:center;gap:10px;padding:16px 18px;color:var(--ink2)}
.lch .q input{flex:1;min-width:0;border:0;background:transparent;font-size:16px;font-weight:500;color:var(--ink);outline:none}
.lch .sec{padding:14px 18px}
.lch .ex{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--ink2);background:none;border:0;padding:4px 0;text-align:left}
.lch .ex code{font-family:inherit;font-size:12px;background:var(--neu);color:var(--ink);border-radius:5px;padding:2px 6px;min-width:200px}
.lch .m{display:flex;align-items:center;gap:10px;padding:8px;border-radius:10px;background:none;border:0;width:100%;text-align:left}
.lch .m:hover{background:var(--tile)}
.lch .foot{background:var(--tile);padding:10px 18px;display:flex;flex-wrap:wrap;gap:14px;font-size:12px;color:var(--ink2)}

/* focus */
.fwrap{background:var(--chart);color:var(--sink);border-radius:18px;padding:32px 24px;display:flex;flex-direction:column;align-items:center;gap:22px;text-align:center}
.fclock{font-size:72px;line-height:78px;font-weight:700;letter-spacing:-.04em;color:var(--em);font-variant-numeric:tabular-nums}
.fclock.paused{color:var(--sink2)}
.dbtn{height:34px;border:0;border-radius:8px;background:var(--active);color:var(--sink);padding:0 12px;display:inline-flex;align-items:center;gap:6px}
.dbtn:hover{background:#303033}
</style>

function vTime() {
  const tk = todayK(); const hp = hourProfile(28);
  let wf = 0, wd = 0; const days = []; for (let i = 6; i >= 0; i--) { const k = addD(tk, -i); const x = dayTime(k); wf += x.focus; wd += x.dist; days.push([k, x]); }
  const maxD = Math.max(60, ...days.map(([, x]) => x.focus + x.dist));
  const maxH = Math.max(1, ...hp.h);
  const kinds = {}; S.sessions.items.filter(s => s.start > Date.now() - 28 * 864e5).forEach(s => (s.dist||[]).forEach(d => { kinds[d.kind] = (kinds[d.kind]||0) + d.min; }));
  const projRows = S.meta.projects.map(p => [p.name, projTime(p.id)]).filter(x => x[1] > 0).sort((a, b) => b[1] - a[1]);
  const best = hp.n >= 6 ? bestWindow(hp.h) : null;
  return { main: `<div class="hd"><div><h1 class="h1">Time</h1><div class="date">From your focus sessions and distraction logs</div></div></div>
    <div class="grid"><div class="tile"><div class="meta">Focused, 7 days</div><div class="stat" style="margin-top:6px">${fmtDur(wf)}</div></div><div class="tile"><div class="meta">Distracted, 7 days</div><div class="stat" style="margin-top:6px">${fmtDur(wd)}</div><div class="meta" style="margin-top:6px">${wf + wd ? pct(wd, wf + wd) : 0}% of session time</div></div><div class="tile"><div class="meta">Best hours, 4 weeks</div><div class="stat" style="margin-top:6px;font-size:20px">${best != null ? fmtT(best * 60) + ' to ' + fmtT((best + 2) * 60) : '—'}</div><div class="meta" style="margin-top:6px">${hp.n} sessions</div></div></div>
    <section>${sec('analytics','Last 7 days')}<div class="tile"><div style="display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:12px;align-items:end;height:160px">${days.map(([k, x], i) => `<div class="col" style="align-items:center;justify-content:flex-end;height:100%;gap:4px"><span class="cap num" style="color:var(--ink2)">${fmtDur(x.focus)}</span><span style="width:100%;max-width:34px;height:${x.dist / maxD * 120}px;background:var(--em);border-radius:4px 4px 0 0"></span><span style="width:100%;max-width:34px;height:${Math.max(2, x.focus / maxD * 120)}px;background:${i === 6 ? 'var(--ink)' : 'var(--ink)'};border-radius:${x.dist ? '0 0 4px 4px' : '4px'}"></span></div>`).join('')}</div><div style="display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:12px;margin-top:6px;text-align:center">${days.map(([k]) => `<span class="cap">${DOW[parseD(k).getDay()]}</span>`).join('')}</div><div class="flex g14 cap" style="margin-top:10px;color:var(--ink2)"><span class="flex g6"><i class="dot" style="background:var(--ink);width:6px;height:6px"></i>Focused</span><span class="flex g6"><i class="dot" style="background:var(--em);width:6px;height:6px"></i>Distracted</span></div></div></section>
    <section>${sec('time','When you focus, 4 weeks', '<span class="cap" style="color:var(--ink2)">Focus minutes by hour of day</span>')}<div class="tile" style="overflow-x:auto"><div style="display:grid;grid-template-columns:repeat(18,minmax(22px,1fr));gap:4px;align-items:end;height:120px;min-width:520px">${hp.h.slice(5, 23).map((v, i) => `<span title="${fmtT((i + 5) * 60)}: ${fmtDur(v)}" style="height:${Math.max(2, v / maxH * 110)}px;border-radius:3px;background:${best != null && (i + 5 === best || i + 5 === best + 1) ? 'var(--ink)' : 'var(--ring)'}"></span>`).join('')}</div><div style="display:grid;grid-template-columns:repeat(18,minmax(22px,1fr));gap:4px;margin-top:6px;text-align:center;min-width:520px">${hp.h.slice(5, 23).map((_, i) => `<span class="cap">${((i + 5) % 12) || 12}</span>`).join('')}</div></div></section>

    <section>${sec('phone','Distractions, 4 weeks')}<div class="tile col g10">${Object.entries(kinds).sort((a, b) => b[1] - a[1]).map(([k, m]) => `<div class="flex between"><span>${esc(k)}</span><span class="meta num">${fmtDur(m)}</span></div>`).join('') || '<span class="meta">None logged. Use the buttons in Focus, or type “distracted 10 min by phone”.</span>'}</div></section></div>` };

function vInsights() {
  const ins = insights(); const tk = todayK();
  const tests = S.tests.items;
  const testHTML = tests.map(t => { const day = diffD(t.start, tk) + 1; const h = habitById(t.habitId);
    if (day <= 14) return `<div class="tile now"><div class="flex between wrap g8"><div><span class="tag t-em">In progress</span><div style="font-weight:600;margin-top:8px">${esc(t.change)}</div><div class="meta" style="margin-top:4px">Measuring: ${esc(h ? h.name : 'habit')}</div></div><div style="text-align:right"><div class="stat">Day ${day} of 14</div><div class="meta">Ends ${fmtDay(addD(t.start, 13))}</div></div></div><div class="bar" style="margin-top:12px;background:var(--emtr)"><i style="width:${day / 14 * 100}%;background:var(--em)"></i></div><p class="meta" style="margin:10px 0 0">Results show after day 14 so a few good days don’t look like proof.</p><button class="btn ghost" style="margin-top:6px" data-a="delTest" data-id="${t.id}">Stop test</button></div>`;
    const r = testResult(t); if (!r) return '';
    const enough = r.during.c >= 10 && r.before.c >= 7; const diff = (r.during.p ?? 0) - (r.before.p ?? 0);

      ${st.sample ? `<div class="flex wrap g12"><div class="grow"><div>Clear the example data</div><div class="meta" style="margin-top:3px">Removes everything so you can start with your own areas, habits and tasks.</div></div>${ui.confirm === 'clear' ? `<button class="btn danger" data-a="clearAll">Yes, clear everything</button><button class="btn ghost" data-a="confirm" data-v="">Cancel</button>` : `<button class="btn danger" data-a="confirm" data-v="clear">Clear example data</button>`}</div>` :
      `<div class="flex wrap g12"><div class="grow"><div style="color:var(--emi)">Delete all data</div><div class="meta" style="margin-top:3px">Permanent. Export first if you want a copy.</div></div>${ui.confirm === 'clear' ? `<button class="btn danger" data-a="clearAll">Yes, delete everything</button><button class="btn ghost" data-a="confirm" data-v="">Cancel</button>` : `<button class="btn danger" data-a="confirm" data-v="clear">Delete all data</button>`}</div>`}
    </div></section>
    <section class="tile" style="padding:18px"><div class="h3">What this prototype leaves out</div><p class="meta" style="margin:6px 0 0;line-height:18px">Calendar sync, Analytics, mobile layout, reminders that notify you, AI on notes, and accounts. Calendar and Analytics are greyed out in the sidebar.</p></section>`;
  return { main };
}

/* ---------- launcher ---------- */
function openLauncher(prefill) { ui.launcher = true; ui.q = prefill || ''; renderLauncher(); const i = $('#lq'); if (i) { i.focus(); i.setSelectionRange(i.value.length, i.value.length); } }
function closeLauncher() { ui.launcher = false; $('#layer').innerHTML = ''; }
function launcherPreview() {
  const p = parseLine(ui.q); const q = ui.q.trim().toLowerCase();
  const matches = q.length >= 2 ? S.tasks.items.filter(t => t.title.toLowerCase().includes(q)).slice(0, 3).map(t => ({ k: 'task', id: t.id, label: t.title, meta: t.done ? 'Task · done' : 'Task · ' + relDay(t.due) })).concat(S.notes.items.filter(n => (n.title + ' ' + n.body).toLowerCase().includes(q)).slice(0, 2).map(n => ({ k: 'note', id: n.id, label: n.title, meta: 'Note' }))) : [];
  const ex = [['task call bank tomorrow 10am #finance high','Task with date, time, tag, priority'],['meditated','Marks a habit done'],['slept 11 to 6:30','Logs last night'],['distracted 20 min by phone','Logs a distraction'],['focus ' + ((S.tasks.items.find(t => !t.done) || {}).title || 'a task').toLowerCase(),'Starts the focus timer'],['event review at 3pm','Adds a time block today'],['note meeting ideas','Opens a new note']];
  return `${p ? `<div class="sec"><div class="cap" style="color:var(--ink2);margin-bottom:8px">Understood as</div><div class="flex wrap g6">${p.chips.map(([l, c]) => `<span class="chip ${c}">${esc(l)}</span>`).join('')}</div><div class="flex g8" style="margin-top:12px"><button class="btn" data-a="lgo">${p.kind === 'inbox' ? 'Capture to Inbox' : p.kind === 'task' ? 'Create task' : p.kind === 'sleep' ? 'Save sleep' : p.kind === 'habit' ? 'Mark done' : p.kind === 'dist' ? 'Log distraction' : p.kind === 'focus' ? 'Start focus' : p.kind === 'note' ? 'Create note' : 'Add block'} <kbd class="kbd" style="background:#262628;color:#c9c6be">Enter</kbd></button></div></div><div class="sep"></div>` : ''}
    ${matches.length ? `<div class="sec" style="padding:10px 10px"><div class="cap" style="color:var(--ink2);padding:0 8px;margin-bottom:4px">Matches</div>${matches.map(m => `<button class="m" data-a="lopen" data-v="${m.k}" data-id="${m.id}"><span class="itile" style="background:var(--tile)">${ic(m.k === 'task' ? 'tasks' : 'note')}</span><span class="grow">${esc(m.label)}</span><span class="meta">${esc(m.meta)}</span></button>`).join('')}</div><div class="sep"></div>` : ''}
    ${!p ? `<div class="sec"><div class="cap" style="color:var(--ink2);margin-bottom:8px">Try one line</div>${ex.map(([c, d]) => `<button class="ex" data-a="lfill" data-v="${esc(c)}"><code>${esc(c)}</code><span>${esc(d)}</span></button>`).join('')}</div>` : ''}`;
}
function renderLauncher() {
  if (!ui.launcher) return;
  $('#layer').innerHTML = `<div class="scrim" data-a="lclose"><div class="lch" role="dialog" aria-modal="true" aria-label="Quick Launcher" data-stop="1">
    <div class="q">${ic('search',18)}<label class="sr" for="lq">Search, add or log anything</label><input id="lq" autocomplete="off" value="${esc(ui.q)}" placeholder="Search, add or log anything…"><kbd class="kbd">Esc</kbd></div><div class="sep"></div>
    <div id="lprev">${launcherPreview()}</div>
    <div class="foot"><span><kbd class="kbd">Enter</kbd> Do it</span><span><kbd class="kbd">Esc</kbd> Close</span><span style="margin-left:auto">Starts with: task, event, note, focus, slept, distracted</span></div></div></div>`;
}

/* ---------- render ---------- */
function render() {
  const t = S.timer.t;
  $('#tpill').innerHTML = t ? `<div class="pill"><span class="livedot" style="${t.start ? '' : 'background:var(--sink3)'}"></span><a class="n" href="#focus">${esc(t.taskId ? (taskById(t.taskId)?.title || 'Focus') : 'Focus')}</a><span class="t" data-live="clock">${fmtClock(elapsedMs(t))}</span><button class="ibd" style="color:var(--sink)" data-a="pause" aria-label="${t.start ? 'Pause' : 'Resume'} focus">${ic(t.start ? 'pause' : 'play', 16, 1.9)}</button></div>` : '';
  $('#avatar').textContent = (S.meta.name || '·').charAt(0).toUpperCase();
  $('#sb').innerHTML = sidebar();
  if (mode === 'loading') { $('#main').innerHTML = '<p class="meta">Loading your data…</p>'; $('#rail').hidden = true; return; }
  const fn = { today: vToday, upcoming: vUpcoming, inbox: vInbox, tasks: vTasks, projects: vProjects, goals: vGoals, areas: vAreas, notes: vNotes, habits: vHabits, sleep: vSleep, focus: vFocus, time: vTime, insights: vInsights, prefs: vPrefs }[view] || vToday;
  let r; try { r = fn(); } catch (e) { console.error(e); r = { main: `<div class="tile"><div class="h3">This screen hit a problem</div><p class="meta" style="margin:6px 0 0">${esc(e.message)}. Your data is safe. Try another screen.</p></div>` }; }
  $('#main').innerHTML = r.main;
  const rail = $('#rail'); if (r.rail) { rail.innerHTML = r.rail; rail.hidden = false; rail.classList.toggle('wide', !!r.wide); } else { rail.hidden = true; rail.innerHTML = ''; }
  document.title = 'Life System';
}
let lastMinute = -1;
function tick() {
  const t = S.timer.t; if (t) document.querySelectorAll('[data-live="clock"]').forEach(el => { el.textContent = fmtClock(elapsedMs(t)); });
  const m = nowMin(); if (m !== lastMinute) { const first = lastMinute === -1; lastMinute = m; const a = document.activeElement; if (!first && !ui.launcher && !(a && /INPUT|TEXTAREA|SELECT/.test(a.tagName)) && (view === 'today' || view === 'focus')) render(); }
}

/* ---------- actions ---------- */
const A = {
  noop() {}, go(d) { go(d.v); },
  tvSet(d) { ui.tv[d.k] = d.v; saveTv(); render(); },
  tvReset() { Object.assign(ui.tv, { status: 'open', proj: '', pri: '' }); ui.tag = null; saveTv(); render(); },
  calNav(d) { const v = +d.v; if (!v) ui.tv.month = null; else { const m = ui.tv.month || todayK().slice(0, 7); const [y, mo] = m.split('-').map(Number); const nd = new Date(y, mo - 1 + v, 1); ui.tv.month = nd.getFullYear() + '-' + pad(nd.getMonth() + 1); } render(); },
  calMore(d) { ui.calDay = ui.calDay === d.v ? null : d.v; render(); },
  projColor(d) { const p = projById(d.id); if (p) { p.color = d.v; save('meta'); render(); } },
  launch(d) { openLauncher(d.v || ''); },
  lclose(d, e) { if (e.target.closest('[data-stop]') && !e.target.matches('.scrim')) return; closeLauncher(); },
  lfill(d) { ui.q = d.v; $('#lq').value = d.v; $('#lprev').innerHTML = launcherPreview(); $('#lq').focus(); },
  lgo() { runParsed(parseLine(ui.q)); },
  lopen(d) { closeLauncher(); if (d.v === 'task') { ui.sel = d.id; go('tasks'); } else { ui.note = d.id; go('notes'); } },
  toggleTask(d) { const t = taskById(d.id); if (!t) return; t.done = !t.done; t.doneAt = t.done ? todayK() : null; if (t.done && S.timer.t && S.timer.t.taskId === t.id) stopTimer(false); save('tasks'); render(); if (t.done) toast('Done: ' + t.title + (projById(t.projectId) ? ' · ' + projById(t.projectId).name + ' ' + projPct(t.projectId) + '%' : '')); },
  selTask(d) { ui.sel = d.id || null; ui.confirm = null; if (view !== 'tasks' && view !== 'focus' && d.id) go('tasks'); else render(); },
  goSel(d) { if (d.id) ui.sel = d.id; go(d.v); },
  startTask(d) { startTimer(d.id); }, startFree() { startTimer(null); },
  startBlock(d) { const b = S.blocks.items.find(x => x.id === d.id); if (b) startTimer(b.taskId || null, b.id); },
  pause() { pauseTimer(); }, stop() { stopTimer(false); render(); }, stopDone() { stopTimer(true); go('today'); },
  dmin(d) { ui.dmin = +d.v; render(); }, dist(d) { logDistraction(ui.dmin || 5, d.v); render(); },
  toggleBlock(d) { const b = S.blocks.items.find(x => x.id === d.id); if (!b) return; b.done = !b.done; if (b.habitId) setH(b.habitId, b.date, b.done ? 'done' : null); if (b.taskId && b.done) { const t = taskById(b.taskId); if (t && !t.done && b.kind !== 'focus') { t.done = true; t.doneAt = todayK(); save('tasks'); } } save('blocks'); render(); },
  delBlock(d) { S.blocks.items = S.blocks.items.filter(b => b.id !== d.id); save('blocks'); render(); },
  addBlockOpen() { ui.addBlock = true; render(); $('#b-t')?.focus(); }, addBlockClose() { ui.addBlock = false; render(); },
  habit(d) { const h = habitById(d.id); if (!h || h.src === 'wake') return; const tk = todayK(); const done = hstat(h, tk) === 'done'; setH(h.id, tk, done ? null : 'done'); ui.missing = null; render(); },
  hskip(d) { const tk = todayK(); const h = habitById(d.id); setH(d.id, tk, hstat(h, tk) === 'skip' ? null : 'skip'); render(); },
  hmiss(d) { setH(d.id, todayK(), 'miss'); ui.missing = d.id; render(); },
  hreason(d) { setH(d.id, todayK(), 'miss', d.v || null); ui.missing = null; render(); toast('Saved. One missed day changes your 30-day rate by about 3 points.'); },
  delHabit(d) { S.meta.habits = S.meta.habits.filter(h => h.id !== d.id); delete S.habitlog.log[d.id]; ui.confirm = null; save('meta', 'habitlog'); render(); },
  confirm(d) { ui.confirm = d.v || null; render(); },
  toggleSub(d) { const t = taskById(d.id); const s = t && t.subs.find(x => x.id === d.v); if (s) { s.done = !s.done; save('tasks'); render(); } },
  delSub(d) { const t = taskById(d.id); if (t) { t.subs = t.subs.filter(x => x.id !== d.v); save('tasks'); render(); } },
  postpone(d) { const t = taskById(d.id); if (!t) return; t.due = addD(t.due && t.due > todayK() ? t.due : todayK(), 1); t.postponed = (t.postponed || 0) + 1; save('tasks'); render(); toast('Moved to ' + relDay(t.due).toLowerCase() + '.'); },
  delTask(d) { S.tasks.items = S.tasks.items.filter(t => t.id !== d.id); ui.sel = null; ui.confirm = null; save('tasks'); render(); },
  sortTask(d) { const x = S.inbox.items.find(i => i.id === d.id); if (!x) return; const tok = parseTokens(x.text); S.tasks.items.push(newTask(tok)); S.inbox.items = S.inbox.items.filter(i => i.id !== d.id); save('tasks', 'inbox'); render(); toast('Turned into a task' + (tok.due ? ' for ' + relDay(tok.due).toLowerCase() : '') + '.'); },
  sortNote(d) { const x = S.inbox.items.find(i => i.id === d.id); if (!x) return; S.notes.items.unshift({ id: uid(), title: x.text.slice(0, 60), body: x.text, folder: 'Notes', updated: Date.now() }); S.inbox.items = S.inbox.items.filter(i => i.id !== d.id); save('notes', 'inbox'); render(); toast('Turned into a note.'); },
  delInbox(d) { S.inbox.items = S.inbox.items.filter(i => i.id !== d.id); save('inbox'); render(); },
  delSleep(d) { S.sleep.items = S.sleep.items.filter(s => s.date !== d.v); save('sleep'); render(); },
  testOpen(d) { ui.testFor = d.v; if (view !== 'insights') go('insights'); else render(); },
  testClose() { ui.testFor = null; render(); },
  delTest(d) { S.tests.items = S.tests.items.filter(t => t.id !== d.id); save('tests'); render(); },
  selProj(d, e) { if (e) e.preventDefault(); ui.proj = d.id || null; ui.confirm = null; if (view !== 'projects' && d.id) go('projects'); else render(); },
  delProj(d) { S.meta.projects = S.meta.projects.filter(p => p.id !== d.id); S.tasks.items.forEach(t => { if (t.projectId === d.id) t.projectId = null; }); ui.proj = null; ui.confirm = null; save('meta', 'tasks'); render(); },
  delGoal(d) { S.meta.goals = S.meta.goals.filter(g => g.id !== d.id); S.meta.projects.forEach(p => { if (p.goalId === d.id) p.goalId = null; }); ui.confirm = null; save('meta'); render(); },
  delArea(d) { S.meta.areas = S.meta.areas.filter(a => a.id !== d.id); S.meta.habits.forEach(h => { if (h.areaId === d.id) h.areaId = null; }); S.meta.goals.forEach(g => { g.areaIds = (g.areaIds||[]).filter(x => x !== d.id); }); ui.confirm = null; save('meta'); render(); },
  note(d) { ui.note = d.id || null; ui.confirm = null; render(); },
  newNote() { const n = { id: uid(), title: '', body: '', folder: ui.folder || 'Notes', updated: Date.now() }; S.notes.items.unshift(n); ui.note = n.id; save('notes'); render(); $('#n-t')?.focus(); },
  delNote(d) { S.notes.items = S.notes.items.filter(n => n.id !== d.id); ui.note = null; ui.confirm = null; save('notes'); render(); },
  folder(d) { ui.folder = d.v || null; ui.note = null; if (view !== 'notes') go('notes'); else render(); },
  tag(d) { ui.tag = d.v || null; if (view !== 'tasks') go('tasks'); else render(); },
  async export() {
    const data = JSON.stringify({ exported: new Date().toISOString(), app: 'Life System prototype', data: S }, null, 2);
    if (!dl) { try { dl = await window.claude?.use?.('downloads'); } catch (e) { dl = null; } }
    if (!dl) { toast('Export isn’t available in this view. Open the page from claude.ai.'); return; }
    try { await dl.save({ filename: 'life-system-' + todayK() + '.json', data }); } catch (e) { if (e && e.code !== 'declined') toast('Export didn’t go through. Try again in a moment.'); }
  },
  async clearAll() {
    const keep = S.timer.t ? null : null; S = blank(); ui.confirm = null; ui.sel = null; ui.note = null; ui.proj = null;
    PARTS.forEach(p => dirty.add(p)); await flush(); render(); toast('Cleared. Start by adding a life area.'); go('areas');
  }
};
const FORMS = {
  quickTask(f, fd) { const q = fd.get('q').trim(); if (!q) return; const tok = parseTokens(q); S.tasks.items.push(newTask(tok)); save('tasks'); render(); $('#qt')?.focus(); toast('Task added' + (tok.due ? ' for ' + relDay(tok.due).toLowerCase() : '') + '.'); },
  projTask(f, fd) { const q = fd.get('q').trim(); if (!q) return; const tok = parseTokens(q); tok.projectId = f.dataset.id; S.tasks.items.push(newTask(tok)); save('tasks'); render(); $('#pt')?.focus(); },
  taskTitle(f, fd) { const t = taskById(f.dataset.id); const v = fd.get('title').trim(); if (t && v) { t.title = v; save('tasks'); render(); } },
  taskEdit(f, fd) { const t = taskById(f.dataset.id); if (!t) return; t.due = fd.get('due') || null; t.time = fd.get('time') || null; t.pri = fd.get('pri'); t.est = +fd.get('est') || null; t.projectId = fd.get('projectId') || null; t.tags = (fd.get('tags') || '').split(/[\s,]+/).filter(Boolean).map(x => x.startsWith('#') ? x.toLowerCase() : '#' + x.toLowerCase()); save('tasks'); render(); },
  addSub(f, fd) { const t = taskById(f.dataset.id); const v = fd.get('t').trim(); if (t && v) { t.subs = t.subs || []; t.subs.push({ id: uid(), t: v, done: false }); save('tasks'); render(); $('#as-' + t.id)?.focus(); } },
  inbox(f, fd) { const v = fd.get('t').trim(); if (!v) return; S.inbox.items.unshift({ id: uid(), text: v, created: Date.now() }); save('inbox'); render(); $('#ib-in')?.focus(); },
  habit(f, fd) { const n = fd.get('name').trim(); if (!n) return; const wake = fd.get('wake'); S.meta.habits.push({ id: uid(), name: n, areaId: fd.get('areaId') || null, time: fd.get('time') || null, created: todayK(), src: wake ? 'wake' : undefined, wakeBy: wake ? (fd.get('time') || '07:00') : undefined }); save('meta'); render(); toast('Habit added.'); },
  sleep(f, fd) { const date = fd.get('date'); const ex = sleepOn(date); if (ex) { ex.bed = fd.get('bed'); ex.wake = fd.get('wake'); } else S.sleep.items.push({ date, bed: fd.get('bed'), wake: fd.get('wake') }); save('sleep'); render(); toast('Night saved.'); },
  sleepQuick(f, fd) { S.sleep.items.push({ date: todayK(), bed: fd.get('bed'), wake: fd.get('wake') }); save('sleep'); render(); toast('Sleep saved.'); },
  block(f, fd) { const s = fd.get('start'), e = fd.get('end'); if (toMin(e) <= toMin(s)) { toast('End time needs to be after the start.'); return; } S.blocks.items.push({ id: uid(), date: f.dataset.v, title: fd.get('title').trim() || 'Block', start: s, end: e, kind: fd.get('kind'), taskId: fd.get('taskId') || null, habitId: fd.get('habitId') || null, link: fd.get('link') || null, done: false }); ui.addBlock = false; save('blocks'); render(); },
  proj(f, fd) { const n = fd.get('name').trim(); if (!n) return; S.meta.projects.push({ id: uid(), name: n, goalId: fd.get('goalId') || null, color: fd.get('color') || 'blue', created: todayK() }); save('meta'); render(); },
  goal(f, fd) { S.meta.goals.push({ id: uid(), title: fd.get('title').trim(), areaIds: fd.get('areaId') ? [fd.get('areaId')] : [], due: fd.get('due'), doneWhen: fd.get('doneWhen').trim(), progress: 0, created: todayK() }); save('meta'); render(); },
  area(f, fd) { S.meta.areas.push({ id: uid(), name: fd.get('name').trim(), color: fd.get('color'), target: +fd.get('target') || 80, pri: +fd.get('pri') || 2, self: null }); save('meta'); render(); toast('Area added. Link habits and goals to it to give it a score.'); },
  noteEdit(f, fd) { const n = S.notes.items.find(x => x.id === f.dataset.id); if (!n) return; n.title = fd.get('title'); n.body = fd.get('body'); n.folder = fd.get('folder').trim() || 'Notes'; n.updated = Date.now(); save('notes'); toast('Note saved.'); },
  test(f, fd) { const x = insights().out.find(i => i.key === f.dataset.v); if (!x) return; let c = fd.get('c'); if (c === '__own') c = (fd.get('own') || '').trim() || 'My own change'; S.tests.items.push({ id: uid(), key: x.key, habitId: x.habitId, change: c, start: todayK() }); ui.testFor = null; save('tests'); render(); toast('Test started. Check back in 14 days.'); },
  prefs(f, fd) { S.meta.name = fd.get('name').trim(); Object.assign(S.meta.settings, { bedtime: fd.get('bedtime') || '23:30', earlyWake: fd.get('earlyWake') || '06:30', target: +fd.get('target') || 90, targetDate: fd.get('targetDate') || S.meta.settings.targetDate }); save('meta'); render(); toast('Settings saved.'); }
};
const CHANGES = {
  tv(el) { ui.tv[el.dataset.k] = el.value; saveTv(); render(); },
  goalProg(el) { const g = goalById(el.dataset.id); if (g) { g.progress = +el.value; save('meta'); render(); } },
  projGoal(el) { const p = projById(el.dataset.id); if (p) { p.goalId = el.value || null; save('meta'); render(); } },
  areaSelf(el) { const a = areaById(el.dataset.id); if (a) { a.self = +el.value || null; save('meta'); render(); } },
  areaPri(el) { const a = areaById(el.dataset.id); if (a) { a.pri = +el.value; save('meta'); render(); } },
  areaTarget(el) { const a = areaById(el.dataset.id); if (a) { a.target = Math.max(1, Math.min(100, +el.value || 80)); save('meta'); render(); } }
};

document.addEventListener('click', e => {
  const el = e.target.closest('[data-a]'); if (!el) return;
  const a = el.dataset.a; if (!A[a]) return;
  if (a === 'lclose') { if (e.target !== el) return; }
  if (el.tagName === 'A' && (a === 'noop' || a === 'selProj')) e.preventDefault();
  A[a](el.dataset, e);
});
document.addEventListener('submit', e => { const f = e.target.closest('form[data-f]'); if (!f) return; e.preventDefault(); const fn = FORMS[f.dataset.f]; if (fn) fn(f, new FormData(f)); });
document.addEventListener('change', e => {
  const el = e.target; if (el.dataset && el.dataset.ch && CHANGES[el.dataset.ch]) { CHANGES[el.dataset.ch](el); return; }
  const f = el.closest && el.closest('form[data-f="taskEdit"]'); if (f) FORMS.taskEdit(f, new FormData(f));
});
document.addEventListener('focusout', e => { const f = e.target.closest && e.target.closest('form[data-f="taskTitle"]'); if (f && e.target.name === 'title') FORMS.taskTitle(f, new FormData(f)); });
document.addEventListener('input', e => { if (e.target.id === 'lq') { ui.q = e.target.value; $('#lprev').innerHTML = launcherPreview(); } });
document.addEventListener('keydown', e => {
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); ui.launcher ? closeLauncher() : openLauncher(''); return; }
  if (ui.launcher) { if (e.key === 'Escape') { e.preventDefault(); closeLauncher(); } else if (e.key === 'Enter' && e.target.id === 'lq') { e.preventDefault(); runParsed(parseLine(ui.q)); } }
});
$('#launchBtn').addEventListener('click', () => openLauncher(''));
$('#ic-search').outerHTML = ic('search');
window.addEventListener('hashchange', () => { readHash(); ui.confirm = null; if (view !== 'notes') ui.note = ui.note; render(); window.scrollTo(0, 0); });

/* ---------- boot ---------- */
async function boot() {
  readHash(); render();
  let d = null;
  try { d = window.claude && window.claude.use ? await window.claude.use('db') : null; } catch (e) { d = null; }
  if (d) {
    db = d;
    try { const snaps = await Promise.all(PARTS.map(p => db.doc('ls/' + p).get())); snaps.forEach((s, i) => { if (s.exists) mergePart(PARTS[i], s.data()); }); mode = 'db'; }
    catch (e) { mode = 'local'; loadLocal(); toast('Couldn’t reach saved data. Working in this browser for now.'); }
  } else { mode = 'local'; loadLocal(); }
  render(); setInterval(tick, 1000);
}
boot();
})();
</script>
