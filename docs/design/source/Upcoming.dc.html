<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Upcoming</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ember.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap">
<style>body{margin:0;background:#0f0f10}</style>
</helmet>
<div class="app" style="min-height: 1100px">
  <dc-import name="Titlebar" hint-size="100%,58px"></dc-import>
  <div class="row">
    <dc-import name="Sidebar" active="upcoming" hint-size="232px,1000px"></dc-import>
    <main class="panel">
      <div class="hd">
        <div><h1 class="h1">Upcoming</h1><div class="date">Next 5 days · tasks, events and habits together</div></div>
        <div class="flex g8" style="margin-top: 6px">
          <div class="seg" role="group" aria-label="Layout"><button aria-pressed="true"><dc-import name="Icon" i="board" s="14" hint-size="14px,14px"></dc-import>Columns</button><button aria-pressed="false"><dc-import name="Icon" i="list" s="14" hint-size="14px,14px"></dc-import>List</button></div>
          <div class="seg" role="group" aria-label="Show"><button aria-pressed="true">All</button><button aria-pressed="false">Tasks</button><button aria-pressed="false">Events</button><button aria-pressed="false">Habits</button></div>
        </div>
      </div>

      <div style="overflow-x: auto; margin: 0 -4px; padding: 0 4px">
        <div style="display: grid; grid-template-columns: repeat(5, minmax(220px, 1fr)); gap: 12px; min-width: 1100px">
          <sc-for list="{{days}}" as="d" hint-placeholder-count="5">
            <section class="tile" style="padding: 14px; display: flex; flex-direction: column; gap: 12px; min-height: 720px; background: {{d.bg}}">
              <div>
                <div class="flex g8"><span class="h3">{{d.n}}</span><sc-if value="{{d.today}}" hint-placeholder-val="{{false}}"><span class="tag t-em">Today</span></sc-if></div>
                <div class="meta" style="margin-top: 3px">{{d.sum}}</div>
              </div>
              <sc-for list="{{d.items}}" as="it" hint-placeholder-count="3">
                <div style="background: #ffffff; border-radius: 10px; padding: 10px 12px; display: flex; gap: 10px; align-items: flex-start; box-shadow: {{it.sh}}">
                  <sc-if value="{{it.task}}" hint-placeholder-val="{{true}}"><span class="ring {{it.p}}" style="margin-top: -1px" aria-hidden="true"></span></sc-if>
                  <sc-if value="{{it.event}}" hint-placeholder-val="{{false}}"><span style="width: 18px; height: 18px; border-radius: 9999px; background: #e4edfd; color: #2b62d9; display: flex; align-items: center; justify-content: center; flex: none"><dc-import name="Icon" i="calendar" s="11" w="2" hint-size="11px,11px"></dc-import></span></sc-if>
                  <sc-if value="{{it.habit}}" hint-placeholder-val="{{false}}"><span style="width: 18px; height: 18px; border-radius: 9999px; background: #e3f5e9; color: #23804a; display: flex; align-items: center; justify-content: center; flex: none"><dc-import name="Icon" i="habit" s="11" w="2" hint-size="11px,11px"></dc-import></span></sc-if>
                  <div class="grow">
                    <div class="item" style="color: {{it.tc}}">{{it.t}}</div>
                    <div class="flex wrap g6" style="margin-top: 5px"><span class="meta" style="color: {{it.mc}}">{{it.m}}</span><sc-if value="{{it.tag}}" hint-placeholder-val="{{false}}"><span class="tag {{it.tagc}}">{{it.tag}}</span></sc-if></div>
                  </div>
                </div>
              </sc-for>
              <button class="add" style="background: transparent; align-self: flex-start; margin-top: auto"><dc-import name="Icon" i="plus" s="14" hint-size="14px,14px"></dc-import>Add to {{d.short}}</button>
            </section>
          </sc-for>
        </div>
      </div>
    </main>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1100}}'>
class Component extends DCLogic {
  renderVals() {
    var T = function (t, m, p, tag, tagc, o) { o = o || {}; return { task: true, event: false, habit: false, t: t, m: m, p: p || '', tag: tag || '', tagc: tagc || '', tc: o.done ? '#a8a59e' : '#111111', mc: o.late ? '#d5430f' : '#77746e', sh: o.now ? 'inset 3px 0 0 #ff5a1f' : 'none' }; };
    var E = function (t, m, tag, tagc) { return { task: false, event: true, habit: false, t: t, m: m, p: '', tag: tag || '', tagc: tagc || '', tc: '#111111', mc: '#77746e', sh: 'none' }; };
    var H = function (t, m) { return { task: false, event: false, habit: true, t: t, m: m, p: '', tag: '', tagc: '', tc: '#111111', mc: '#77746e', sh: 'none' }; };
    var day = function (n, short, sum, items, today) { return { n: n, short: short, sum: sum, items: items, today: !!today, bg: today ? '#fbf6f2' : '#f3f2ee' }; };
    return {
      days: [
        day('Thu 5 Nov', 'Thursday', '4 tasks · 1 event · 2 habits left', [
          T('Send invoice', 'Overdue · yesterday', 'hi', 'Career', 't-bl', { late: 1 }),
          T('UI research', '9:00 AM · running', 'hi', 'Life System', 't-em', { now: 1 }),
          E('Client call', '12:00 to 12:45 PM', 'Join', 't-bl'),
          H('Meditate', '2:00 PM block'),
          H('Master skill', 'Any time · 45 min'),
          T('Define data model', '4:00 PM', 'md', 'Life System', 't-em'),
          T('Weekly review', '5:30 PM · weekly')
        ], 1),
        day('Fri 6 Nov', 'Friday', '2 tasks · 1 event · 4 habits', [
          T('Call bank', '10:00 AM', 'hi', '#finance', 't-am'),
          T('Book gym trial', 'Any time', '', 'Fitness routine', 't-gr'),
          E('Design review', '3:00 to 3:30 PM', '#work', 't-bl'),
          H('4 daily habits', 'Wake, Read, Meditate, Master skill')
        ]),
        day('Sat 7 Nov', 'Saturday', '1 event · 4 habits', [
          E('Family lunch', '1:00 to 3:00 PM', 'Family', 't-pk'),
          H('4 daily habits', 'Wake, Read, Meditate, Master skill')
        ]),
        day('Sun 8 Nov', 'Sunday', '1 task · 4 habits', [
          T('Plan next week', '8:00 PM', '', '', ''),
          H('4 daily habits', 'Wake, Read, Meditate, Master skill')
        ]),
        day('Mon 9 Nov', 'Monday', '1 task · 1 event · 4 habits', [
          T('Plan 12-week running schedule', 'Due', 'md', 'Fitness routine', 't-gr'),
          E('Sprint planning', '10:00 to 11:00 AM', '#work', 't-bl'),
          H('4 daily habits', 'Master skill is missed most on Mondays')
        ])
      ]
    };
  }
}
</script>
</body>
</html>
