name: Build

# Runs on every push to main, on pull requests, and on demand from the
# "Actions" tab on GitHub ("Run workflow").
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  FLUTTER_VERSION: "3.47.9"
  # These three are PUBLIC values (server addresses and the publishable key).
  # Set them on GitHub: Settings > Secrets and variables > Actions > Variables.
  # If they are not set, the build still works and the app shows its
  # "not set up yet" screen.
  SUPABASE_URL: ${{ vars.SUPABASE_URL }}
  SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
  POWERSYNC_URL: ${{ vars.POWERSYNC_URL }}

jobs:
  check:
    name: Analyze and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Write .env
        shell: bash
        run: printf 'SUPABASE_URL=%s\nSUPABASE_PUBLISHABLE_KEY=%s\nPOWERSYNC_URL=%s\n' "$SUPABASE_URL" "$SUPABASE_PUBLISHABLE_KEY" "$POWERSYNC_URL" > .env
      - run: flutter pub get
      - name: Generate database code
        run: dart run build_runner build
      - run: flutter analyze
      - run: flutter test

  windows:
    name: Windows app
    needs: check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Write .env
        shell: bash
        run: printf 'SUPABASE_URL=%s\nSUPABASE_PUBLISHABLE_KEY=%s\nPOWERSYNC_URL=%s\n' "$SUPABASE_URL" "$SUPABASE_PUBLISHABLE_KEY" "$POWERSYNC_URL" > .env
      - run: flutter pub get
      - name: Generate database code
        run: dart run build_runner build
      - run: flutter build windows --release
      - uses: actions/upload-artifact@v4
        with:
          name: orbito-windows
          path: build/windows/x64/runner/Release/
          if-no-files-found: error

  android:
    name: Android APK
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Write .env
        shell: bash
        run: printf 'SUPABASE_URL=%s\nSUPABASE_PUBLISHABLE_KEY=%s\nPOWERSYNC_URL=%s\n' "$SUPABASE_URL" "$SUPABASE_PUBLISHABLE_KEY" "$POWERSYNC_URL" > .env
      - run: flutter pub get
      - name: Generate database code
        run: dart run build_runner build
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: orbito-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
